<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Sentiment Analyzer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617, #0f172a, #082f49);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 500px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 0 35px rgba(14, 165, 233, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 130px;
            resize: none;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #38bdf8;
            background: #020617;
            color: white;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            box-shadow: 0 0 15px #38bdf8;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px #38bdf8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: #020617;
            border-left: 4px solid #38bdf8;
        }

        .result h3 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .prediction {
            font-size: 22px;
            font-weight: bold;
        }

        .confidence {
            color: #cbd5e1;
            margin-top: 8px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 NLP Analyzer</h1>

        <p class="subtitle">
            Transformer Based Sentiment Analysis System
        </p>


        <form method="POST">

            <textarea name="text" placeholder="Enter your text here..."></textarea>

            <button type="submit">
                Analyze Sentiment 🚀
            </button>

        </form>


        {% if prediction %}

        <div class="result">

            <h3>Prediction Result</h3>

            <div class="prediction">
                {{ prediction }}
            </div>

            <div class="confidence">
                Confidence: {{ confidence }}
            </div>

        </div>

        {% endif %}


        <div class="footer">
            Powered by Transformer Model | NLP Project
        </div>


    </div>

</body>

</html>
